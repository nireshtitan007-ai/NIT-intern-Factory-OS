version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: zenlyft-mongo
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: mongosh --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" --quiet
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zenlyft-server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/zenlyft_erp?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-zenlyft_nit_trichy_super_secret_production_key_2026_32char}
      AUTO_SEED: "true"
      ALLOW_BENCHMARK: "true"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-ZENLYFT_DEMO}
      FACTORY_NAME: ${FACTORY_NAME:-"ZenLyft Foods Manufacturing Pvt Ltd"}
      FACTORY_STATE: ${FACTORY_STATE:-"Tamil Nadu"}
      FACTORY_STATE_CODE: ${FACTORY_STATE_CODE:-"33"}
      FACTORY_GSTIN: ${FACTORY_GSTIN:-"33AAAAA0000A1Z5"}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-ZenLyft@123}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_SHOW_EVAL_TOOLS: ${VITE_SHOW_EVAL_TOOLS:-true}
    container_name: zenlyft-client
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
